name: Track HAOS Releases

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  UPSTREAM_OWNER: home-assistant
  UPSTREAM_REPO: operating-system
  DOCKERHUB_NAMESPACE: qweritos
  DOCKERHUB_REPOSITORY: haos-one
  MIN_HAOS_MAJOR: "17"
  MIN_HAOS_MINOR: "0"

jobs:
  trigger-missing-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Find missing HAOS tags and trigger builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Fetching upstream releases for ${UPSTREAM_OWNER}/${UPSTREAM_REPO}..."
          releases_json="$(gh api "repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/releases?per_page=100")"

          mapfile -t candidate_tags < <(
            echo "${releases_json}" | jq -r \
              --argjson min_major "${MIN_HAOS_MAJOR}" \
              --argjson min_minor "${MIN_HAOS_MINOR}" '
                .[]
                | select(.draft == false)
                | .tag_name
                | select(test("^[0-9]+\\.[0-9]+"))
                | . as $tag
                | (capture("^(?<major>[0-9]+)\\.(?<minor>[0-9]+)")) as $v
                | select(($v.major|tonumber) > $min_major or (($v.major|tonumber) == $min_major and ($v.minor|tonumber) >= $min_minor))
                | $tag
              '
          )

          if [ "${#candidate_tags[@]}" -eq 0 ]; then
            echo "No upstream tags match >= ${MIN_HAOS_MAJOR}.${MIN_HAOS_MINOR}."
            exit 0
          fi

          echo "Found ${#candidate_tags[@]} candidate upstream tags."
          triggered=0
          skipped=0

          # Process oldest->newest for deterministic rollout.
          for (( idx=${#candidate_tags[@]}-1 ; idx>=0 ; idx-- )); do
            tag="${candidate_tags[$idx]}"
            encoded_tag="$(jq -rn --arg t "${tag}" '$t|@uri')"
            tag_url="https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${DOCKERHUB_REPOSITORY}/tags/${encoded_tag}"

            if curl -fsS "${tag_url}" >/dev/null; then
              echo "Skip ${tag}: Docker Hub tag already exists."
              skipped=$((skipped + 1))
              continue
            fi

            echo "Trigger build for missing tag ${tag}..."
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/docker-image.yml/dispatches" \
              -f ref=master \
              -f "inputs[HAOS_VERSION]=${tag}" \
              >/dev/null

            triggered=$((triggered + 1))
          done

          echo "Done. Triggered=${triggered}, skipped=${skipped}."
