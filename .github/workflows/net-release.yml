name: Publish Host Networking Companion

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archives
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION//\//-}"
          mkdir -p dist/net
          build_archive() {
            os="$1"
            arch="$2"
            extension="$3"
            archive="$4"
            work="dist/net/haos-one-net-${VERSION}-${os}-${arch}"
            mkdir -p "${work}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${work}/haos-one-net${extension}" ./cmd/haos-one-net
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" \
              -o "${work}/wireguard-go${extension}" golang.zx2c4.com/wireguard
            cp LICENSE "${work}/"
            if [ "${os}" = windows ]; then
              (cd dist/net && zip -qr "${archive}" "$(basename "${work}")")
            else
              (cd dist/net && tar -czf "${archive}" "$(basename "${work}")")
            fi
            rm -rf "${work}"
          }
          build_archive darwin amd64 "" "haos-one-net-${VERSION}-darwin-amd64.tar.gz"
          build_archive darwin arm64 "" "haos-one-net-${VERSION}-darwin-arm64.tar.gz"
          build_archive windows amd64 ".exe" "haos-one-net-${VERSION}-windows-amd64.zip"
          (cd dist/net && sha256sum -- ./*.tar.gz ./*.zip > SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haos-one-net
          path: dist/net/*

      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/net/*
