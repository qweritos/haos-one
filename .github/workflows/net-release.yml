name: Publish HAOS One Host Companion

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build standalone executables
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION//\//-}"
          mkdir -p dist/host
          build_binary() {
            os="$1"
            arch="$2"
            output="$3"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/host/${output}" ./cmd/haos-one-host
          }
          build_binary darwin amd64 haos-one-host-mac-intel
          build_binary darwin arm64 haos-one-host-mac-apple-silicon
          build_binary windows amd64 haos-one-host-windows.exe
          (cd dist/host && sha256sum -- \
            haos-one-host-mac-intel \
            haos-one-host-mac-apple-silicon \
            haos-one-host-windows.exe > SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haos-one-host
          path: dist/host/*

      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/host/*
