name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      HAOS_VERSION:
        description: "HAOS release tag (for example: 15.2). Leave empty to use latest."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: qweritos/haos-one
  HAOS_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.HAOS_VERSION || '' }}
  TAG_BASE: ${{ github.ref_name == 'master' && github.event.inputs.HAOS_VERSION == '' && 'latest' || github.ref_name }}

# need separate jobs because we need kvm kernel module, and binfmt can't handle such requirement.
# also, native platform-specific runners and parallel jobs are making process way faster.
# upd: gh-hosted runner ubuntu-24.04-arm don't have kvm either, fall back to LIBGUESTFS_BACKEND_SETTINGS=force_tcg
jobs:
  build-amd64:
    name: Build amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG_BASE }}-amd64
            type=raw,value=${{ env.HAOS_VERSION }}-amd64,enable=${{ env.HAOS_VERSION != '' }}
            type=raw,value=${{ github.ref_name }}-${{ env.HAOS_VERSION }}-amd64,enable=${{ env.HAOS_VERSION != '' && github.ref_name != 'master' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            HAOS_VERSION=${{ env.HAOS_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=haos-one-amd64
          cache-to: type=gha,mode=max,scope=haos-one-amd64

  build-arm64:
    name: Build arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG_BASE }}-arm64
            type=raw,value=${{ env.HAOS_VERSION }}-arm64,enable=${{ env.HAOS_VERSION != '' }}
            type=raw,value=${{ github.ref_name }}-${{ env.HAOS_VERSION }}-arm64,enable=${{ env.HAOS_VERSION != '' && github.ref_name != 'master' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            HAOS_VERSION=${{ env.HAOS_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=haos-one-arm64
          cache-to: type=gha,mode=max,scope=haos-one-arm64

  publish-manifests:
    name: Publish manifests
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          docker buildx imagetools create -t "${IMAGE_NAME}:${TAG_BASE}" \
            "${IMAGE_NAME}:${TAG_BASE}-amd64" \
            "${IMAGE_NAME}:${TAG_BASE}-arm64"
          docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${TAG_BASE}" \
            "${DOCKERHUB_IMAGE}:${TAG_BASE}-amd64" \
            "${DOCKERHUB_IMAGE}:${TAG_BASE}-arm64"
          if [ -n "${HAOS_VERSION}" ]; then
            docker buildx imagetools create -t "${IMAGE_NAME}:${HAOS_VERSION}" \
              "${IMAGE_NAME}:${HAOS_VERSION}-amd64" \
              "${IMAGE_NAME}:${HAOS_VERSION}-arm64"
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${HAOS_VERSION}" \
              "${DOCKERHUB_IMAGE}:${HAOS_VERSION}-amd64" \
              "${DOCKERHUB_IMAGE}:${HAOS_VERSION}-arm64"
            if [ "${GITHUB_REF_NAME}" != "master" ]; then
              docker buildx imagetools create -t "${IMAGE_NAME}:${GITHUB_REF_NAME}-${HAOS_VERSION}" \
                "${IMAGE_NAME}:${GITHUB_REF_NAME}-${HAOS_VERSION}-amd64" \
                "${IMAGE_NAME}:${GITHUB_REF_NAME}-${HAOS_VERSION}-arm64"
              docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-${HAOS_VERSION}" \
                "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-${HAOS_VERSION}-amd64" \
                "${DOCKERHUB_IMAGE}:${GITHUB_REF_NAME}-${HAOS_VERSION}-arm64"
            fi
          fi
