name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      HAOS_VERSION:
        description: "HAOS version to build (for example: 15.2). Leave empty to use latest."
        required: false
        type: string
      IMAGE_TAG:
        description: "Optional Docker tag for branch previews (for example: host-assisted-discovery-preview)."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: qweritos/haos-one
  ARTIFACTHUB_REPO_METADATA_PATH: artifacthub-repo.yml
  HAOS_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.HAOS_VERSION || '' }}
  TAG_BASE: ${{ github.event.inputs.IMAGE_TAG != '' && github.event.inputs.IMAGE_TAG || (github.ref_name == 'master' && github.event.inputs.HAOS_VERSION == '' && 'latest' || github.ref_name) }}

# need separate jobs because we need kvm kernel module, and binfmt can't handle such requirement.
# also, native platform-specific runners and parallel jobs are making process way faster.
# upd: gh-hosted runner ubuntu-24.04-arm don't have kvm either, fall back to LIBGUESTFS_BACKEND_SETTINGS=force_tcg
jobs:
  resolve-haos-version:
    name: Resolve HAOS version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${HAOS_VERSION}"
          if [ -z "${version}" ]; then
            version="$(gh api repos/home-assistant/operating-system/releases/latest --jq '.tag_name // empty')"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+([.][0-9A-Za-z-]+)*$ ]]; then
            echo "Invalid HAOS version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-amd64:
    name: Build amd64
    runs-on: ubuntu-latest
    needs: resolve-haos-version
    env:
      HAOS_VERSION: ${{ needs.resolve-haos-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve major version tag
        id: major-version-tag
        shell: bash
        run: |
          major_tag=""
          if [[ "${HAOS_VERSION}" =~ ^([0-9]+)\. ]]; then
            major_tag="${BASH_REMATCH[1]}"
          fi
          echo "tag=${major_tag}" >> "${GITHUB_OUTPUT}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG_BASE }}-amd64
            type=raw,value=${{ env.HAOS_VERSION }}-amd64,enable=${{ github.ref_name == 'master' && env.HAOS_VERSION != '' }}
            type=raw,value=${{ steps.major-version-tag.outputs.tag }}-amd64,enable=${{ github.ref_name == 'master' && steps.major-version-tag.outputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            HAOS_VERSION=${{ env.HAOS_VERSION }}
            AGENT_VERSION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=haos-one-amd64
          cache-to: type=gha,mode=max,scope=haos-one-amd64

  build-arm64:
    name: Build arm64
    runs-on: ubuntu-24.04-arm
    needs: resolve-haos-version
    env:
      HAOS_VERSION: ${{ needs.resolve-haos-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve major version tag
        id: major-version-tag
        shell: bash
        run: |
          major_tag=""
          if [[ "${HAOS_VERSION}" =~ ^([0-9]+)\. ]]; then
            major_tag="${BASH_REMATCH[1]}"
          fi
          echo "tag=${major_tag}" >> "${GITHUB_OUTPUT}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG_BASE }}-arm64
            type=raw,value=${{ env.HAOS_VERSION }}-arm64,enable=${{ github.ref_name == 'master' && env.HAOS_VERSION != '' }}
            type=raw,value=${{ steps.major-version-tag.outputs.tag }}-arm64,enable=${{ github.ref_name == 'master' && steps.major-version-tag.outputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            HAOS_VERSION=${{ env.HAOS_VERSION }}
            AGENT_VERSION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=haos-one-arm64
          cache-to: type=gha,mode=max,scope=haos-one-arm64

  publish-manifests:
    name: Publish manifests
    runs-on: ubuntu-latest
    needs: [resolve-haos-version, build-amd64, build-arm64]
    env:
      HAOS_VERSION: ${{ needs.resolve-haos-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        shell: bash
        run: |
          docker buildx imagetools create -t "${IMAGE_NAME}:${TAG_BASE}" \
            "${IMAGE_NAME}:${TAG_BASE}-amd64" \
            "${IMAGE_NAME}:${TAG_BASE}-arm64"
          docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${TAG_BASE}" \
            "${DOCKERHUB_IMAGE}:${TAG_BASE}-amd64" \
            "${DOCKERHUB_IMAGE}:${TAG_BASE}-arm64"
          if [ "${GITHUB_REF_NAME}" = "master" ] && [ -n "${HAOS_VERSION}" ]; then
            docker buildx imagetools create -t "${IMAGE_NAME}:${HAOS_VERSION}" \
              "${IMAGE_NAME}:${HAOS_VERSION}-amd64" \
              "${IMAGE_NAME}:${HAOS_VERSION}-arm64"
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${HAOS_VERSION}" \
              "${DOCKERHUB_IMAGE}:${HAOS_VERSION}-amd64" \
              "${DOCKERHUB_IMAGE}:${HAOS_VERSION}-arm64"
            if [[ "${HAOS_VERSION}" =~ ^([0-9]+)\. ]]; then
              major_tag="${BASH_REMATCH[1]}"
              docker buildx imagetools create -t "${IMAGE_NAME}:${major_tag}" \
                "${IMAGE_NAME}:${major_tag}-amd64" \
                "${IMAGE_NAME}:${major_tag}-arm64"
              docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${major_tag}" \
                "${DOCKERHUB_IMAGE}:${major_tag}-amd64" \
                "${DOCKERHUB_IMAGE}:${major_tag}-arm64"
            fi
          fi

      - name: Log in to registry (ORAS)
        run: |
          echo "${DOCKERHUB_TOKEN}" | oras login docker.io \
            --username "${DOCKERHUB_USERNAME}" \
            --password-stdin
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Artifact Hub repository metadata
        run: |
          oras push \
            "docker.io/${DOCKERHUB_IMAGE}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${ARTIFACTHUB_REPO_METADATA_PATH}:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

  bump-chart-app-version:
    name: Bump chart app version
    runs-on: ubuntu-latest
    needs: [resolve-haos-version, publish-manifests]
    if: github.ref_name == 'master'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Update chart image version
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAOS_VERSION: ${{ needs.resolve-haos-version.outputs.version }}
        run: |
          latest_version="$(gh api repos/home-assistant/operating-system/releases/latest --jq '.tag_name // empty')"
          if [ -z "${latest_version}" ]; then
            echo "Failed to resolve the latest stable HAOS version." >&2
            exit 1
          fi
          if [ "${HAOS_VERSION}" != "${latest_version}" ]; then
            echo "Skip chart bump: ${HAOS_VERSION} is not the latest stable HAOS version (${latest_version})."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          current_version="$(sed -n 's/^appVersion: *"\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p' charts/haos-one/Chart.yaml)"
          current_image_tag="$(sed -n 's/^  tag: *"\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p' charts/haos-one/values.yaml)"
          if [ "${current_version}" = "${HAOS_VERSION}" ] && [ "${current_image_tag}" = "${HAOS_VERSION}" ]; then
            echo "Chart already uses HAOS ${HAOS_VERSION}."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sed -i -E "s/^appVersion: .*/appVersion: \"${HAOS_VERSION}\"/" charts/haos-one/Chart.yaml
          sed -i -E "s/^  tag: .*/  tag: \"${HAOS_VERSION}\"/" charts/haos-one/values.yaml
          perl -i -pe 's{^(\| `image\.tag` \| Image tag \|) `[^`]+` \|$}{$1 `'"${HAOS_VERSION}"'` |}' charts/haos-one/README.md
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open chart version bump PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(chart): bump HAOS app version to ${{ needs.resolve-haos-version.outputs.version }}"
          title: "chore(chart): bump HAOS app version to ${{ needs.resolve-haos-version.outputs.version }}"
          body: |
            Updates the Helm chart after the matching HAOS image was published.
          branch: automation/bump-haos-app-version
          delete-branch: true
          add-paths: |
            charts/haos-one/Chart.yaml
            charts/haos-one/values.yaml
            charts/haos-one/README.md
